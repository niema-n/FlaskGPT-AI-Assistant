[project]
name = "project-10"
version = "0.1.0"
description = "TP FlaskGPT avec Tailwind CSS"
authors = [
    {name = "Etudiant"}
]
requires-python = ">=3.10"
dependencies = [
    "flask (==2.3.3)",
    "groq (>=1.7.0,<2.0.0)",
    "python-dotenv (==1.0.0)",
    "reportlab (>=5.1.0,<6.0.0) ; python_version >= \"3.10\" and python_version < \"4\"",
    "pypdf (>=6.21.2,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
